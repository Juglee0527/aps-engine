name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Java 21 Gradle test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Run scheduling performance baselines
        run: ./gradlew performanceTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-test-results
          path: |
            build/test-results/test
            build/reports/tests/test
            build/test-results/performanceTest
            build/reports/tests/performanceTest
          if-no-files-found: warn
          retention-days: 7
