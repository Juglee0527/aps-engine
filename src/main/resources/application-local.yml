spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:aps}
    username: ${POSTGRES_USER:aps}
    password: ${POSTGRES_PASSWORD}
  flyway:
    baseline-on-migrate: false
    locations: classpath:db/migration
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate

